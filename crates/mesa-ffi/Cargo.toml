[package]
name = "mesa-ffi"
description = "C ABI for immutable buffers, deterministic peers, durable flows and wire codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
mesa-bytes = { path = "../mesa-bytes" }
mesa-core = { path = "../mesa-core" }
mesa-store = { path = "../mesa-store" }
mesa-transport = { path = "../mesa-transport" }
mesa-flow = { path = "../mesa-flow" }
mesa-crypto = { path = "../mesa-crypto" }
serde_json = "1"
mesa-wire = { path = "../mesa-wire" }

# Raw pointers are confined to this ABI crate. The codec remains unsafe-free.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
